services:
  postgres:
    image: postgres:16-alpine
    container_name: planejador_bncc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planejador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planejador123}
      POSTGRES_DB: ${POSTGRES_DB:-planejador_bncc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planejador} -d ${POSTGRES_DB:-planejador_bncc}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
